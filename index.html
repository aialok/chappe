  <body>
    <div id="root">
      <main style="max-width: 640px; margin: 64px auto; padding: 0 20px; font-family: system-ui, sans-serif">
        <h1>Chappe: file transfer at the speed of sight</h1>
        <p>
          Send files and text between two devices by scanning QR codes. One device shows a stream
          of codes, the other reads them with its camera. No internet, no server, no upload.
          Optional passphrase encryption with AES-256-GCM. Free and open source.
        </p>
        <noscript>Chappe runs in your browser and needs JavaScript turned on.</noscript>
